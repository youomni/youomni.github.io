<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouOmni Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 360px;
      padding: 24px;
      background: #1c1c1c;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 16px;
      font-size: 22px;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab {
      flex: 1;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2a2a2a;
      color: white;
    }

    .tab.active {
      background: #4a90e2;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      outline: none;
      background: #2a2a2a;
      color: white;
    }

    button.primary {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background: #4a90e2;
      color: white;
    }

    button.google {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background: white;
      color: black;
    }

    .hidden {
      display: none;
    }

    .hint {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="container">
    <h1>Login</h1>

    <div class="tabs">
      <button class="tab active" onclick="showTab('login')">Login</button>
      <button class="tab" onclick="showTab('signup')">Sign Up</button>
    </div>

    <!-- LOGIN -->
    <div id="loginForm">
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Password" />
      <button class="primary">Login</button>
    </div>

    <!-- SIGN UP -->
    <div id="signupForm" class="hidden">
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Create Password" />
      <button class="primary">Create Account</button>
    </div>

    <!-- GOOGLE -->
    <button class="google">Continue with Google</button>

    <div class="hint">
      Access will be checked after authentication
    </div>
  </div>

  <script>
    function showTab(tab) {
      const login = document.getElementById("loginForm");
      const signup = document.getElementById("signupForm");
      const tabs = document.querySelectorAll(".tab");

      if (tab === "login") {
        login.classList.remove("hidden");
        signup.classList.add("hidden");
        tabs[0].classList.add("active");
        tabs[1].classList.remove("active");
      } else {
        signup.classList.remove("hidden");
        login.classList.add("hidden");
        tabs[1].classList.add("active");
        tabs[0].classList.remove("active");
      }
    }
  </script>

</body>
</html>
