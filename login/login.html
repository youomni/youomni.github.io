<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouOmni Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 360px;
      padding: 24px;
      background: #1c1c1c;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);

      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 22px;
    }

    /* 🔲 Shared block style */
    .block {
      border: 1px solid white;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #181818;
    }

    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      outline: none;
      background: #2a2a2a;
      color: white;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button.primary {
      background: #4a90e2;
      color: white;
    }

    button.google {
      background: white;
      color: black;
    }

    .or {
      text-align: center;
      font-size: 12px;
      opacity: 0.6;
    }

    .hint {
      font-size: 12px;
      text-align: center;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Enter</h1>

    <!-- 🔲 OPTION 1: EMAIL -->
    <div class="block">
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Password" />
      <button class="primary">Enter</button>
    </div>

    <div class="or">Or</div>

    <!-- 🔲 OPTION 2: GOOGLE -->
    <div class="block">
      <button class="google">Enter with Google</button>
    </div>

    <div class="hint">
      Access will be checked after authentication
    </div>

  </div>

</body>
</html>
