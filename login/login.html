<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouOmni Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 340px;
      padding: 24px;
      background: #1c1c1c;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      margin: 0 0 16px;
      font-size: 22px;
      text-align: center;
    }

    .tabs {
      display: flex;
      gap: 8px;
      margin-bottom: 16px;
    }

    .tab {
      flex: 1;
      padding: 8px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      background: #2a2a2a;
      color: white;
    }

    .tab.active {
      background: #4a90e2;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #4a90e2;
      color: white;
    }

    .google {
      background: white;
      color: black;
    }

    .hidden {
      display: none;
    }

    .hint {
      font-size: 12px;
      text-align: center;
      margin-top: 10px;
      opacity: 0.7;
    }
  </style>
</head>

<body>
  <div class="container">
    <h1>Welcome</h1>

    <div class="tabs">
      <button class="tab active" onclick="showTab('login')">Login</button>
      <button class="tab" onclick="showTab('signup')">Sign Up</button>
    </div>

    <div id="loginForm">
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Password" />
      <button class="primary">Login</button>
    </div>

    <div id="signupForm" class="hidden">
      <input type="email" placeholder="Email" />
      <input type="password" placeholder="Create Password" />
      <button class="primary">Create Account</button>
    </div>

    <button class="google">Continue with Google</button>

    <div class="hint">
      After authentication, access will be checked for purchased lessons
    </div>
  </div>

  <script>
    function showTab(tab) {
      const login = document.getElementById('loginForm');
      const signup = document.getElementById('signupForm');
      const buttons = document.querySelectorAll('.tab');

      if (tab === 'login') {
        login.classList.remove('hidden');
        signup.classList.add('hidden');
        buttons[0].classList.add('active');
        buttons[1].classList.remove('active');
      } else {
        signup.classList.remove('hidden');
        login.classList.add('hidden');
        buttons[1].classList.add('active');
        buttons[0].classList.remove('active');
      }
    }
  </script>
</body>
</html>
