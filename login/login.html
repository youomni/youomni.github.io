<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouOmni Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 360px;
      padding: 24px;
      background: #1c1c1c;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
    }

    h1 {
      text-align: center;
      margin-bottom: 16px;
      font-size: 22px;
    }

    input {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      border: none;
      border-radius: 8px;
      outline: none;
      background: #2a2a2a;
      color: white;
    }

    button.primary {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background: #4a90e2;
      color: white;
    }

    button.google {
      width: 100%;
      padding: 10px;
      margin-top: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
      background: white;
      color: black;
    }

    .hint {
      margin-top: 12px;
      font-size: 12px;
      text-align: center;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- TITLE -->
    <h1>Enter</h1>

    <!-- LOGIN FORM -->
    <input type="email" placeholder="Email" />
    <input type="password" placeholder="Password" />

    <!-- MAIN ACTION -->
    <button class="primary">Enter</button>

    <!-- GOOGLE LOGIN -->
    <button class="google">Continue with Google</button>

    <div class="hint">
      Access will be checked after authentication
    </div>

  </div>

</body>
</html>
