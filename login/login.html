<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouOmni Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 360px;
      padding: 24px;
      background: #1c1c1c;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 22px;
    }

    .block {
      border: 1px solid #3a3a3a;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #181818;
    }

    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      background: #2a2a2a;
      color: white;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      border-radius: 8px;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    .primary {
      background: #4a90e2;
      color: white;
    }

    .google {
      background: white;
      color: black;
    }

    .or {
      text-align: center;
      font-size: 12px;
      opacity: 0.6;
    }
  </style>
</head>

<body>

<div class="container">

  <h1>Enter</h1>

  <div class="block">
    <input id="email" type="email" placeholder="Email" />
    <input id="password" type="password" placeholder="Password" />
    <button class="primary" onclick="handleLogin()">Enter</button>
  </div>

  <div class="or">Or</div>

  <div class="block">
    <button class="google" onclick="handleGoogle()">Continue with Google</button>
  </div>

</div>

<script>
  function redirectAfterLogin() {
    const params = new URLSearchParams(window.location.search);
    const redirect = params.get("redirect");

    window.location.href = redirect || "/index.html";
  }

  function handleLogin() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("Enter email and password");
      return;
    }

    localStorage.setItem("youomni_user", "true");

    // ✅ FIX: delay avoids redirect bug
    setTimeout(redirectAfterLogin, 50);
  }

  function handleGoogle() {
    // 🔥 still fake (no real OAuth yet)
    localStorage.setItem("youomni_user", "true");

    // ✅ FIX
    setTimeout(redirectAfterLogin, 50);
  }
</script>

</body>
</html>
