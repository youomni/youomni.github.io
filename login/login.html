<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>YouOmni Login</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f0f0f;
      color: white;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }

    .container {
      width: 360px;
      padding: 24px;
      background: #1c1c1c;
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.4);

      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    h1 {
      text-align: center;
      margin: 0;
      font-size: 22px;
    }

    .block {
      border: 1px solid #9C9C9C;
      border-radius: 16px;
      padding: 16px;
      display: flex;
      flex-direction: column;
      gap: 10px;
      background: #181818;
    }

    input {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      outline: none;
      background: #2a2a2a;
      color: white;
      box-sizing: border-box;
    }

    button {
      width: 100%;
      padding: 10px;
      border: none;
      border-radius: 8px;
      cursor: pointer;
      font-weight: bold;
    }

    button.primary {
      background: #4a90e2;
      color: white;
    }

    button.google {
      background: white;
      color: black;
    }

    .or {
      text-align: center;
      font-size: 12px;
      opacity: 0.6;
    }

    .hint {
      font-size: 12px;
      text-align: center;
      opacity: 0.7;
    }
  </style>
</head>

<body>

  <div class="container">

    <h1>Enter</h1>

    <!-- EMAIL LOGIN -->
    <div class="block">
      <input id="email" type="email" placeholder="Email" />
      <input id="password" type="password" placeholder="Password" />
      <button class="primary" onclick="handleLogin()">Enter</button>
    </div>

    <div class="or">Or</div>

    <!-- GOOGLE -->
    <div class="block">
      <button class="google" onclick="handleGoogle()">Enter with Google</button>
    </div>

    <div class="hint">
      Access will be checked after authentication
    </div>

  </div>

  <script>
    function redirectAfterLogin() {
      const params = new URLSearchParams(window.location.search);
      const redirect = params.get("redirect");

      if (redirect) {
        window.location.href = redirect;
      } else {
        window.location.href = "/index.html";
      }
    }

    function handleLogin() {
      const email = document.getElementById("email").value;
      const password = document.getElementById("password").value;

      if (!email || !password) {
        alert("Please enter email and password");
        return;
      }

      // fake auth for now
      localStorage.setItem("youomni_user", "true");

      redirectAfterLogin();
    }

    function handleGoogle() {
      // placeholder (same behavior for now)
      localStorage.setItem("youomni_user", "true");

      redirectAfterLogin();
    }
  </script>

</body>
</html>
